project_name: Life OS
vault_path: C:\Users\user\Desktop\МОЁ РАЗВИТИЕ\LIfe OS\life-os\data\demo-vault
claude:
  model: claude-sonnet-4-6
  max_tokens: 4000
thresholds:
  auto_area: 0.85
  needs_review: 0.55
  related_similarity: 0.75
  related_top_k: 5
rag:
  chunk_size: 800
  chunk_overlap: 120
  embedding_model: local
  index_path: data/rag_index
database:
  path: data/lifeos.sqlite3
logging:
  dir: logs
  level: INFO
vault_layout:
  inbox: Inbox
  notes: Notes
  areas:
    prompt-engineering: Areas/Prompt-Engineering
    vibe-coding: Areas/Vibe-Coding
    longevity: Areas/Longevity
    immortality: Areas/Immortality
  projects: Projects
  tags: Tags

discovery:
  lookback_days: 14
  max_per_run: 12
  state_path: data/discovery_state.json
  topics:
    prompt-engineering:
      - prompt engineering
      - system prompt
      - prompting
      - context engineering
      - retrieval augmented generation
    vibe-coding:
      - vibe coding
      - agentic coding
      - coding agent
      - ai developer tools
      - software engineering agent
    longevity:
      - longevity
      - healthy aging
      - ageing
      - senolytics
      - lifespan
    immortality:
      - radical life extension
      - biological immortality
      - rejuvenation
      - cryonics
      - age reversal
  sources:
    - name: OpenAI News
      url: https://openai.com/news/rss.xml
      topics: [prompt-engineering, vibe-coding]
      priority: 5
    - name: Google AI
      url: https://blog.google/technology/ai/rss/
      topics: [prompt-engineering, vibe-coding]
      priority: 3
    - name: GitHub Changelog
      url: https://github.blog/changelog/feed/
      topics: [vibe-coding]
      priority: 3
    - name: arXiv AI
      url: "https://export.arxiv.org/api/query?search_query=cat:cs.AI&start=0&max_results=40&sortBy=submittedDate&sortOrder=descending"
      topics: [prompt-engineering, vibe-coding]
      priority: 4
    - name: arXiv Quantitative Biology
      url: "https://export.arxiv.org/api/query?search_query=cat:q-bio&start=0&max_results=40&sortBy=submittedDate&sortOrder=descending"
      topics: [longevity, immortality]
      priority: 4
